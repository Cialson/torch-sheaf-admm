# @package _global_
# MPNN game of life
task: maze
model_type: mpnn

training:
  epochs: 40
  ema_decay: 0.995
  mpnn_train_rounds: 20      # même nombre maximal d'itérations que K_train de life_sheaf
  mpnn_eval_rounds: 20       # = K_eval de life_sheaf
  val_interval: 2

data:
  dir: datasets/life_15px_1step
  train_split: train
  val_splits: [test, test_2x]
  loader: puzzle

task_cfg:
  patch_size: 3
  stride: 2
  connectivity: 8
  num_classes: 6

model:
  num_classes: 6
  d_v: 84
  d_e: 42
  encoder_arch: mlp_v2
  enc_hidden_dim: 256
  comm_norm_type: layernorm
  decoder_arch: mlp_concat_v2
  dec_hidden_dim: 256
  mpnn_message_dim: 42
  mpnn_aggregation: max
  mpnn_edge_type_mode: spatial
  num_directions: 8
  mpnn_graph_readout: per_node
