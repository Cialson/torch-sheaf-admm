# @package _global_
# Sheaf-ADMM game of life
task: maze
model_type: sheaf

training:
  epochs: 40
  ema_decay: 0.995
  K_train: 20
  K_eval: 20
  loss_window: 2
  train_iters_dist: uniform
  train_iters_min: 5
  val_interval: 2

data:
  dir: datasets/life_15px_1step
  train_split: train
  val_splits: [test, test_2x]
  loader: puzzle

task_cfg:
  patch_size: 3
  stride: 2
  connectivity: 8
  num_classes: 6

model:
  num_classes: 6
  d_v: 10
  d_e: 5
  encoder_arch: mlp_v2
  enc_hidden_dim: 256
  comm_norm_type: layernorm
  objective_mode: l1box_diag        # closed-form L1 + box x-update
  x_solver: diagonal_prox
  z_solver: unrolled_cg
  z_mode: prox                      # soft consensus
  gamma: 5.0
  cg_iters: 5
  tikhonov_eps: 1.0e-5
  rm_sharing: directional           # one base map per grid direction (8-way, see num_directions)
  rm_init: orthonormal
  rm_mode: context                  # LoRA-modulated restriction maps
  lora_rank: 4
  lora_init_style: standard
  num_directions: 8
  rho_init: 0.25
  decoder_arch: mlp_concat_v2
  dec_hidden_dim: 256
